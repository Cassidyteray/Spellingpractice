<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6755d8"><title>Tahj's Spelling Adventure</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#242247;background:#f5f2ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffb92f;outline-offset:3px}.shell{max-width:900px;margin:auto;padding:20px 16px 60px}.hero{background:linear-gradient(120deg,#6652d6,#a25ad7);border-radius:26px;color:white;padding:25px;box-shadow:0 12px 26px #5446ae22}.hero h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{margin:0;opacity:.95}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:750}.tabs button{background:white;color:#4d4296;border:2px solid #ded8ff}.tabs button.active{background:#5141b7;color:white;border-color:#5141b7}.panel{background:white;border-radius:24px;padding:24px;box-shadow:0 10px 24px #49409c12;min-height:320px}.panel h2{margin:0 0 10px;font-size:1.6rem}.muted{color:#625f79}.btn{background:#6552d8;color:white;min-height:46px}.btn.secondary{background:#e9e5ff;color:#493c9c}.btn.good{background:#138268}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.word{font-size:clamp(2rem,7vw,3.3rem);font-weight:850;letter-spacing:.03em;margin:20px 0;color:#4536a5}.pill{background:#f1edff;color:#493b9b;border-radius:99px;padding:7px 12px;font-weight:700;display:inline-block}.card{background:#f8f6ff;border:2px solid #e8e2ff;border-radius:18px;padding:18px;margin:14px 0}.progress{height:12px;background:#eee9ff;border-radius:99px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#27b69b;transition:width .2s}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}.option{background:#f3efff;border:2px solid #dcd3ff;border-radius:15px;padding:16px;font-weight:800;color:#4c3da3;min-height:60px}.option.selected{background:#d7f8ef;border-color:#159d80}.feedback{border-radius:14px;padding:14px;margin-top:14px;background:#fff2d5;color:#634315;font-weight:650}.feedback.ok{background:#ddf8ec;color:#145d46}.input{border:2px solid #cbc2f8;border-radius:14px;padding:14px;width:100%;max-width:390px;font-size:1.3rem}.small{font-size:.9rem}.footer{text-align:center;margin-top:22px;color:#6a6589}.wordchips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{border:2px solid #d9d1ff;background:#f5f1ff;border-radius:12px;padding:11px 13px;font-weight:750;color:#493b9b}.chip.active{background:#5b48c5;color:white}.chip.used{opacity:.35}.sortbox{border:2px dashed #c7baff;border-radius:15px;padding:13px;min-height:105px;background:#fbfaff}.sortbox h3{margin:0 0 8px}.sortgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tag{display:inline-block;padding:5px 9px;background:#e9e4ff;border-radius:9px;margin:3px;font-weight:650}.hidden{display:none}.star{font-size:2rem}label{font-weight:700} @media(max-width:520px){.panel{padding:18px}.tabs button{flex:1 1 40%;padding:10px 7px;font-size:.92rem}}
</style></head><body><main class="shell"><header class="hero"><div class="star">🌟 📝 🚀</div><h1>Tahj's Spelling Adventure</h1><p>Listen, learn, play, and become a spelling superstar!</p></header><nav class="tabs" aria-label="Activities"><button data-tab="learn" class="active">🔊 Learn</button><button data-tab="sort">🧩 Word Sort</button><button data-tab="spell">✍️ Spell It</button><button data-tab="test">🏆 Spelling Test</button></nav><section class="panel" id="content" aria-live="polite"></section><p class="footer">Made for Tahj 💜 • Practice makes progress!</p></main>
<script>
const words=[{w:'sister',g:'er',hint:'A girl who has the same parent or parents as you.'},{w:'letter',g:'er',hint:'You can mail one or write one in the alphabet.'},{w:'expert',g:'er',hint:'Someone who knows a lot about something.'},{w:'born',g:'or',hint:'A baby is ___ on their birthday.'},{w:'sports',g:'or',hint:'Basketball and soccer are examples.'},{w:'short',g:'or',hint:'The opposite of tall or long.'},{w:'mark',g:'ar',hint:'Make a little line or spot on paper.'},{w:'started',g:'ar',hint:'Began doing something.'},{w:'backyard',g:'ar',hint:'The outdoor space behind a house.'},{w:'some',g:'tricky',hint:'A few, but not all.'}];
const bonus=[{w:'far',g:'ar'},{w:'park',g:'ar'},{w:'storm',g:'or'},{w:'corn',g:'or'},{w:'teacher',g:'er'},{w:'winter',g:'er'}];
const labels={er:'ER sound /ər/',or:'OR sound /ôr/',ar:'AR sound /är/',tricky:'Tricky word'};
let tab='learn',learnIndex=0,sortBonus=false,sortSelected=null,sortPlaced={},sortFeedback='',mode='spell',queue=[],idx=0,attempts=0,missed=[],answered=false,feedback='',showHint=false,correctCount=0;
const el=document.getElementById('content');const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t){if(!('speechSynthesis' in window)){alert('Audio is unavailable in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function setTab(t){tab=t;if(t==='spell'||t==='test')startQuiz(t);render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')})}
function render(){nav();if(tab==='learn')renderLearn();if(tab==='sort')renderSort();if(tab==='spell'||tab==='test')renderQuiz()}
function renderLearn(){let x=words[learnIndex];el.innerHTML=`<div class="row between"><h2>🔊 Learn the Sounds</h2><span class="pill">Word ${learnIndex+1} of ${words.length}</span></div><div class="progress"><div style="width:${(learnIndex+1)/words.length*100}%"></div></div><div class="card"><span class="pill">${labels[x.g]}</span><div class="word">${x.w}</div><div class="row"><button class="btn" id="listen">🔊 Hear the word</button><button class="btn secondary" id="sentence">💬 Hear a sentence</button></div><p class="muted">Clue: ${x.hint}</p></div><p class="small muted">Notice the letters and listen carefully to the vowel sound. Some words don't follow the usual sound pattern!</p><div class="row between"><button class="btn secondary" id="prev" ${learnIndex===0?'disabled':''}>← Previous</button><button class="btn" id="next">${learnIndex===words.length-1?'Start again ↻':'Next word →'}</button></div>`;document.getElementById('listen').onclick=()=>say(x.w);document.getElementById('sentence').onclick=()=>say(`The spelling word is ${x.w}. ${x.hint} ${x.w}.`);document.getElementById('prev').onclick=()=>{learnIndex--;render()};document.getElementById('next').onclick=()=>{learnIndex=(learnIndex+1)%words.length;render()}}
function renderSort(){let pool=sortBonus?bonus:words;let placed=Object.keys(sortPlaced).length;el.innerHTML=`<div class="row between"><h2>🧩 Word Sort</h2><span class="pill">${placed} / ${pool.length} sorted</span></div><p class="muted">Tap a word, then tap the sound group where it belongs. Look for the vowel spelling!</p><div class="row"><button class="btn ${!sortBonus?'':'secondary'}" id="assigned">School words</button><button class="btn ${sortBonus?'':'secondary'}" id="bonus">⭐ Bonus words</button><button class="btn secondary" id="reset">↻ Reset</button></div><div class="wordchips">${pool.map(x=>`<button class="chip ${sortSelected===x.w?'active':''} ${sortPlaced[x.w]?'used':''}" data-word="${x.w}" ${sortPlaced[x.w]?'disabled':''}>${x.w}</button>`).join('')}</div><div class="sortgrid">${Object.keys(labels).filter(g=>!sortBonus||g!=='tricky').map(g=>`<button class="sortbox" data-group="${g}" aria-label="Place selected word in ${labels[g]}"><h3>${labels[g]}</h3>${pool.filter(x=>sortPlaced[x.w]===g).map(x=>`<span class="tag">${x.w}</span>`).join('')}</button>`).join('')}</div>${sortFeedback?`<div class="feedback ${sortFeedback.startsWith('Yes')?'ok':''}">${sortFeedback}</div>`:''}${placed===pool.length?'<div class="feedback ok">🎉 Amazing sorting! You found every pattern!</div>':''}`;
document.getElementById('assigned').onclick=()=>{sortBonus=false;sortPlaced={};sortSelected=null;sortFeedback='';render()};document.getElementById('bonus').onclick=()=>{sortBonus=true;sortPlaced={};sortSelected=null;sortFeedback='';render()};document.getElementById('reset').onclick=()=>{sortPlaced={};sortSelected=null;sortFeedback='';render()};el.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{sortSelected=b.dataset.word;sortFeedback='';render()});el.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{if(!sortSelected){sortFeedback='Choose a word first!';render();return}let x=pool.find(x=>x.w===sortSelected);if(x.g===b.dataset.group){sortPlaced[x.w]=x.g;sortFeedback='Yes! Great job! 🌟';sortSelected=null}else{sortFeedback='Try again! Listen to the vowel sound and look at the letters.'}render()})}
function startQuiz(m,onlyMissed){mode=m;queue=(onlyMissed&&missed.length?missed:words.map(x=>x.w)).slice();if(!onlyMissed)queue.sort(()=>Math.random()-.5);idx=0;attempts=0;missed=[];answered=false;feedback='';showHint=false;correctCount=0}
function renderQuiz(){if(idx>=queue.length){let total=queue.length;el.innerHTML=`<h2>🎉 ${mode==='test'?'Test complete!':'Practice complete!'}</h2><div class="word">${correctCount} / ${total}</div><p>${correctCount===total?'Perfect score! You are a spelling superstar! 🌟':'Great effort, Tahj! Every practice makes you stronger. 💜'}</p>${missed.length?`<div class="card"><strong>Words to practice:</strong><p>${missed.map(escapeHTML).join(', ')}</p></div><button class="btn good" id="retry">🔁 Retry missed words</button>`:''}<button class="btn secondary" id="again">↻ Start a new ${mode==='test'?'test':'practice'}</button>`;document.getElementById('again').onclick=()=>{startQuiz(mode);render()};if(missed.length)document.getElementById('retry').onclick=()=>{let toRetry=[...missed];startQuiz(mode);queue=toRetry;render()};return}
let x=words.find(w=>w.w===queue[idx]);let isTest=mode==='test';el.innerHTML=`<div class="row between"><h2>${isTest?'🏆 Spelling Test':'✍️ Spell It'}</h2><span class="pill">${idx+1} of ${queue.length}</span></div><div class="progress"><div style="width:${idx/queue.length*100}%"></div></div><p class="muted">${isTest?'Listen carefully, then spell the word without hints.':'Listen to the word, then type its spelling. Hints are here if you need them!'}</p><div class="card"><button class="btn" id="hear">🔊 Hear my word</button> <button class="btn secondary" id="hearagain">🔁 Repeat</button>${!isTest?`<button class="btn secondary" id="hintbtn">💡 Hint</button>${showHint?`<p class="muted">${x.hint} • ${labels[x.g]} • ${x.w.length} letters</p>`:''}`:''}<div style="margin-top:20px"><label for="answer">Your spelling:</label><div style="margin-top:8px"><input class="input" id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word" ${answered?'disabled':''} aria-describedby="feedback"></div></div><div class="row" style="margin-top:15px"><button class="btn good" id="check" ${answered?'disabled':''}>Check spelling ✓</button>${answered?'<button class="btn" id="continue">Next word →</button>':''}</div>${feedback?`<div class="feedback ${feedback.startsWith('Correct')?'ok':''}" id="feedback">${feedback}</div>`:'<div id="feedback"></div>'}</div><p class="small muted">${isTest?'No hints during the test. You can review missed words afterward.':'Tip: Say the word slowly, listen for its sounds, then spell it.'}</p>`;
document.getElementById('hear').onclick=()=>say(x.w);document.getElementById('hearagain').onclick=()=>say(x.w);if(!isTest)document.getElementById('hintbtn').onclick=()=>{showHint=true;renderQuiz()};if(!answered){document.getElementById('check').onclick=check;document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()})}else document.getElementById('continue').onclick=()=>{idx++;answered=false;feedback='';showHint=false;renderQuiz()}}
function check(){let field=document.getElementById('answer');let typed=field.value.trim().toLowerCase();if(!typed){field.focus();return}let expected=queue[idx];answered=true;if(typed===expected){correctCount++;feedback='Correct! Amazing spelling! 🌟'}else{missed.push(expected);feedback=`Good try! The correct spelling is <strong>${expected}</strong>. Listen and try saying each sound.`}renderQuiz();say(typed===expected?'Great job!':expected)}
render();
</script></body></html>
